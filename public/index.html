<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusOS</title>
<style>
  :root {
    --bg: #f5f5f2; --card: #fff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e2e2dc;
    --brand: #2f5d50; --brand-ink: #fff; --crit: #b3261e; --high: #b86e00; --ok: #2e7d32; --esc: #6a3fa0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--brand); color: var(--brand-ink); padding: 14px 20px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 0; opacity: .85; font-size: 14px; }
  main { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; padding: 16px; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { margin: 0 0 12px; font-size: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  textarea, input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
  textarea { min-height: 90px; resize: vertical; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--brand); }
  button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); width: 100%; margin-top: 12px; padding: 9px; }
  .result { margin-top: 12px; padding: 10px; border-radius: 6px; background: #eef4f1; font-size: 14px; display: none; }
  .result.show { display: block; }
  .examples { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .examples button { font-size: 12px; padding: 3px 8px; margin: 3px 3px 0 0; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .toolbar .stats { margin-left: auto; color: var(--muted); font-size: 13px; }
  .tickets { display: grid; gap: 10px; }
  .ticket { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; }
  .ticket.critical { border-left: 4px solid var(--crit); }
  .ticket.resolved { opacity: .6; }
  .count { text-align: center; font-weight: 700; font-size: 22px; color: var(--brand); }
  .count small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
  .title { font-weight: 600; }
  .meta { font-size: 13px; color: var(--muted); }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; padding: 2px 7px; border-radius: 99px; margin-right: 4px; background: #eee; }
  .pill.critical { background: #fbe9e7; color: var(--crit); }
  .pill.high { background: #fff3e0; color: var(--high); }
  .pill.escalated { background: #f1eaf9; color: var(--esc); }
  .pill.resolved { background: #e8f5e9; color: var(--ok); }
  .pill.open { background: #e8f0fe; color: #1a56b0; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  .log { margin-top: 16px; font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); max-height: 180px; overflow: auto; border-top: 1px solid var(--line); padding-top: 10px; }
  @media (max-width: 520px) { .ticket { grid-template-columns: 48px 1fr; } .ticket .actions { grid-column: 1 / -1; } }
</style>
</head>
<body>
<header>
  <h1>CampusOS</h1>
  <p>Campus complaints that actually get fixed: merged, routed, escalated, closed.</p>
</header>

<main>
  <section>
    <h2>Report an issue</h2>
    <form id="report">
      <label for="text">What's wrong, and where?</label>
      <textarea id="text" required maxlength="500" placeholder="e.g. Projector in C-204 not working"></textarea>
      <label for="sid">Student ID / USN (optional)</label>
      <input id="sid" maxlength="40" placeholder="1MS22CS001">
      <button class="primary" type="submit">Submit report</button>
    </form>
    <div class="result" id="result" role="status" aria-live="polite"></div>
    <div class="examples">Try:
      <button type="button" data-ex="Projector in C-204 not working">Projector C-204</button>
      <button type="button" data-ex="C-204 projector shows no display">Same projector again</button>
      <button type="button" data-ex="Sparks coming from the switchboard in B-110!">Sparks B-110</button>
      <button type="button" data-ex="Wi-Fi not working in L-201 library">Wi-Fi L-201</button>
    </div>
  </section>

  <section>
    <h2>Ticket board <span class="meta">(admin view)</span></h2>
    <div class="toolbar">
      <button id="demo" type="button">Load demo: 18 complaints</button>
      <button id="overdue" type="button">Simulate +30 hours</button>
      <button id="reset" type="button">Reset</button>
      <span class="stats" id="stats"></span>
    </div>
    <div class="tickets" id="tickets"></div>
    <div class="log" id="log" aria-label="Activity log"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

function log(msg) {
  const line = document.createElement("div");
  line.textContent = `${new Date().toLocaleTimeString()}  ${msg}`;
  $("log").prepend(line);
}

async function refresh() {
  const tickets = await api("/api/tickets");
  const reports = tickets.reduce((n, t) => n + t.reportCount, 0);
  $("stats").textContent = tickets.length ? `${reports} reports → ${tickets.length} tickets` : "";
  $("tickets").innerHTML = tickets.length ? tickets.map((t) => `
    <div class="ticket ${t.is_safety_hazard ? "critical" : ""} ${esc(t.status)}">
      <div class="count">×${t.reportCount}<small>reports</small></div>
      <div>
        <div class="title">${esc(t.id)} · ${esc(t.category)} · ${esc(t.building)} ${esc(t.room)}</div>
        <div class="meta">${esc(t.summary)}</div>
        <div class="meta">→ ${esc(t.department)} · due ${new Date(t.dueBy).toLocaleString()}${t.escalatedTo ? ` · escalated to ${esc(t.escalatedTo)}` : ""}</div>
        <div style="margin-top:4px">
          <span class="pill ${esc(t.status)}">${esc(t.status)}</span>
          <span class="pill ${esc(t.urgency)}">${esc(t.urgency)}</span>
          ${t.is_safety_hazard ? '<span class="pill critical">safety hazard</span>' : ""}
          ${t.needsHumanReview ? '<span class="pill">needs review</span>' : ""}
        </div>
      </div>
      <div class="actions">${t.status !== "resolved" ? `<button type="button" data-resolve="${esc(t.id)}">Mark fixed</button>` : ""}</div>
    </div>`).join("") : '<div class="empty">No tickets yet. Report an issue or load the demo.</div>';
}

$("report").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const { merged, ticket } = await api("/api/report", { text: $("text").value, studentId: $("sid").value });
    const box = $("result");
    box.innerHTML = merged
      ? `<b>Merged into ${esc(ticket.id)}</b>: this issue was already reported. It now has <b>${ticket.reportCount} reports</b>, so nobody files it twice.`
      : `<b>New ticket ${esc(ticket.id)}</b> → ${esc(ticket.department)}, urgency <b>${esc(ticket.urgency)}</b>${ticket.is_safety_hazard ? " · <b>safety fast lane (2-hour SLA)</b>" : ""}.`;
    box.classList.add("show");
    log(`${merged ? "MERGED" : "NEW"} ${ticket.id} x${ticket.reportCount}: notified ${ticket.department}`);
    $("text").value = "";
    refresh();
  } catch (err) { alert(err.message); }
});

document.addEventListener("click", async (e) => {
  const ex = e.target.dataset.ex, id = e.target.dataset.resolve;
  if (ex) { $("text").value = ex; $("text").focus(); }
  if (id) {
    const { ticket } = await api("/api/resolve", { ticketId: id, note: "Fixed by technician" });
    log(`${ticket.id} fixed: ${ticket.reportCount} student(s) notified`);
    refresh();
  }
});

$("demo").onclick = async () => { const r = await api("/api/demo", {}); $("result").classList.remove("show"); log(`Loaded ${r.loaded} demo complaints`); refresh(); };
$("overdue").onclick = async () => {
  const { escalated } = await api("/api/check-overdue", { hours: 30 });
  log(escalated.length ? `30 hours later: escalated ${escalated.join(", ")} to HoD / Facility Head` : "30 hours later: nothing overdue");
  refresh();
};
$("reset").onclick = async () => { await api("/api/reset", {}); $("result").classList.remove("show"); $("log").innerHTML = ""; refresh(); };

refresh();
</script>
</body>
</html>
